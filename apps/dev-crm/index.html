<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Dev CRM</title>
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <header>
      <h1 id="title">Dev CRM</h1>
      <span class="hint">Test page for the PEF Hub extension. Exposes <code>window.pefHubCrm</code>.</span>
    </header>
    <main>
      <section>
        <h2>Contacts <small>(click a number → clickToDial)</small></h2>
        <table id="contacts"><thead><tr><th>Name</th><th>Phone</th></tr></thead><tbody></tbody></table>
      </section>
      <section>
        <h2>Current record <small>(screenPop)</small></h2>
        <div id="record" class="card empty">No record open</div>
      </section>
      <section>
        <h2>Interactions <small>(snapshot + updates)</small></h2>
        <table id="interactions"><thead><tr><th>ID</th><th>ANI</th><th>Queue</th><th>State</th><th>Owner</th></tr></thead><tbody></tbody></table>
      </section>
      <section class="wide">
        <h2>Event log <button id="clear">Clear</button></h2>
        <ol id="log"></ol>
      </section>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
